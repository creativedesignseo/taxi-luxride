backend:
  name: git-gateway
  branch: main

media_folder: "public/img"
public_folder: "/img"

site_url: https://taxiluxride.com
logo_url: /img/logo-main.png
locale: 'es'

collections:
  - name: "config"
    label: "⚙️ Configuración"
    files:
      - name: "contact_info"
        label: "Datos de Contacto"
        file: "src/i18n/locales/es.json"
        fields:
          - {label: "Teléfono Visual", name: "phone_display", widget: "string"}
          
  - name: "pages"
    label: "📄 Contenido Web"
    files:
      - name: "home_es"
        label: "Inicio (Español)"
        file: "src/i18n/locales/es.json"
        fields:
          - label: "SEO"
            name: "seo"
            widget: "object"
            fields:
              - {label: "Título", name: "title", widget: "string"}
              - {label: "Descripción", name: "description", widget: "text"}
          - label: "Precios"
            name: "rates"
            widget: "object"
            fields:
              - {label: "🟢 Mostrar Sección de Tarifas", name: "active", widget: "boolean", default: true}
              - {label: "Aeropuerto", name: "airport", widget: "string"}
              - {label: "Puerto", name: "port", widget: "string"}
              
  - name: "billing"
    label: "💳 Suscripción y Pagos"
    files:
      - name: "stripe_portal"
        label: "Gestión de Facturas"
        file: "src/i18n/locales/billing.json"
        description: "⚠️ Haz clic en el enlace de abajo para ir a tu Área de Cliente en Stripe y gestionar tus pagos."
        fields:
          - {label: "Aviso", name: "billing_notice", widget: "string", readonly: true}
          - {label: "Tu enlace de Stripe", name: "stripe_url", widget: "string", readonly: true}
